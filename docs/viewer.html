<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교안 보기 · Claude 업무 자동화 클래스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23242629'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%23FC5230'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FFCD4A'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%236FB848'/%3E%3C/svg%3E">
</head>
<body class="viewer">
<header class="v-top">
  <a class="back" href="index.html#slides"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="hide-sm">메인</span></a>
  <select id="topic" aria-label="교안 선택"></select>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <a class="btn sm hide-sm" id="dl-pptx">PPTX</a>
  <a class="btn sm" id="dl-pdf">PDF</a>
  <button class="btn sm hide-sm" id="fs" type="button" style="border:0;cursor:pointer;font:inherit;font-weight:700">전체 화면</button>
</header>
<div class="stage" id="stage">
  <button class="nav-btn prev" id="prev" aria-label="이전 슬라이드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img id="slide" alt="">
  <button class="nav-btn next" id="next" aria-label="다음 슬라이드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
</div>
<div class="strip" id="strip"></div>

<script src="assets/data.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const topics = COURSE.topics;
  let topic = topics.find(t => t.id === q.get('t')) || topics[0];
  let idx = Math.max(0, Math.min(topic.count - 1, (parseInt(q.get('s'), 10) || 1) - 1));
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const src = (t, i, thumb) => `assets/slides/${t.id}/${pad(i + 1)}${thumb ? '_t' : ''}.webp`;

  const sel = $('topic');
  topics.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = `${t.no} ${t.title}`; sel.appendChild(o); });
  sel.addEventListener('change', () => { topic = topics.find(t => t.id === sel.value); idx = 0; load(); });

  function load() {
    sel.value = topic.id;
    document.title = `${topic.no} ${topic.title} · Claude 업무 자동화 클래스`;
    const base = `downloads/${topic.id}-${topic.slug}`;
    const name = `${topic.no}_${topic.title.replace(/[·\s]+/g, '_')}`;
    $('dl-pptx').href = base + '.pptx'; $('dl-pptx').download = name + '.pptx';
    $('dl-pdf').href = base + '.pdf'; $('dl-pdf').download = name + '.pdf';
    const strip = $('strip'); strip.innerHTML = '';
    for (let i = 0; i < topic.count; i++) {
      const b = document.createElement('button');
      b.setAttribute('aria-label', `${i + 1}번 슬라이드`);
      b.innerHTML = `<img src="${src(topic, i, true)}" alt="" loading="lazy">`;
      b.addEventListener('click', () => go(i));
      strip.appendChild(b);
    }
    go(idx);
  }

  function go(i) {
    idx = Math.max(0, Math.min(topic.count - 1, i));
    const img = $('slide');
    img.src = src(topic, idx);
    img.alt = `${topic.title} ${idx + 1}번 슬라이드`;
    $('count').textContent = `${idx + 1} / ${topic.count}`;
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === topic.count - 1;
    [...$('strip').children].forEach((b, j) => b.classList.toggle('on', j === idx));
    $('strip').children[idx].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    history.replaceState(null, '', `?t=${topic.id}&s=${idx + 1}`);
    [idx - 1, idx + 1].forEach(j => { if (j >= 0 && j < topic.count) new Image().src = src(topic, j); });
  }

  $('prev').addEventListener('click', () => go(idx - 1));
  $('next').addEventListener('click', () => go(idx + 1));
  $('slide').addEventListener('click', e => { const r = e.target.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? idx - 1 : idx + 1); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(idx + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(topic.count - 1);
    if (e.key === 'f') toggleFs();
  });
  let sx = null;
  $('stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1)); sx = null; });
  function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen?.(); }
  $('fs').addEventListener('click', toggleFs);
  load();
</script>
</body>
</html>
